name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [ubuntu-latest, self-hosted]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake
    
    - name: Configure with CMake
      run: cmake -GNinja .
    
    - name: Build
      run: cmake --build .
