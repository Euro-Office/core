name: Build

on:
  pull_request:
  push:
    branches: [main, 'stable-*']
  workflow_dispatch:

# A new push to a pull request cancels its previous run, which also keeps an
# older run from publishing its core package after a newer one. Other runs
# (manual ones included) get a group of their own: GitHub keeps only one
# pending run per group, so queued commits on main would lose their package.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # A manual run only builds the third-party libraries (job third-party)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The release images (.docker/core.bake.Dockerfile): Rocky Linux 8
        # for both products. The desktop image only adds the -devel packages
        # for Qt and the desktop app, which core doesn't use, so the server
        # legs build the core packages for both products. The arm64 leg runs
        # natively on GitHub's hosted arm runners (V8 is far too slow under
        # QEMU); swap in a self-hosted arm label if you have one.
        include:
          # packages: the core packages this leg publishes
          - { product: server,  distro: rocky8, arch: amd64, platform: linux-amd64, packages: server desktop, runner: self-hosted }
          - { product: server,  distro: rocky8, arch: arm64, platform: linux-arm64, packages: server desktop, runner: ubuntu-24.04-arm }
    name: build (${{ matrix.product }}, ${{ matrix.distro }}, ${{ matrix.arch }})
    env:
      CCACHE_MAXSIZE: 2G
      BASE_IMAGE: euro-office/core-base-${{ matrix.product }}-${{ matrix.arch }}:ci
      BUILD_IMAGE: euro-office/core-ci-${{ matrix.product }}-${{ matrix.arch }}:ci

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Build environment: the core-base stage of the release Dockerfile
    - name: Get core-base image
      run: .github/scripts/core-base-image.sh ${{ matrix.product }} ${{ matrix.arch }} "$BASE_IMAGE"

    # CI-only additions on top of core-base: fonts for the conversion test.
    # x2t measures text (e.g. spreadsheet column widths) with the system
    # fonts, and the base images ship none.
    - name: Add test fonts
      run: |
        docker build --build-arg BASE="$BASE_IMAGE" -t "$BUILD_IMAGE" - <<'DOCKERFILE'
        ARG BASE
        FROM ${BASE}
        RUN if command -v dnf >/dev/null; then \
              dnf install -y liberation-fonts dejavu-sans-fonts dejavu-serif-fonts && dnf clean all; \
            else \
              apt-get update && \
              apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core && \
              rm -rf /var/lib/apt/lists/*; \
            fi
        DOCKERFILE

    # Runs a command inside the build image with the checkout mounted at
    # /core (same path as in the Dockerfile). The vcpkg binary cache is
    # mounted where the image's VCPKG_BINARY_SOURCES expects it.
    - name: Create container wrapper
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg" "$GITHUB_WORKSPACE/.cache/ccache"
        cat > "$RUNNER_TEMP/in-build-image" <<'SH'
        #!/bin/sh
        exec docker run --rm \
          -v "$GITHUB_WORKSPACE:/core" -w /core \
          -v "$GITHUB_WORKSPACE/.cache/vcpkg:/nuget-cache" \
          -e CCACHE_DIR=/core/.cache/ccache \
          -e CCACHE_MAXSIZE \
          -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
          "$BUILD_IMAGE" bash -euo pipefail -c "$1"
        SH
        chmod +x "$RUNNER_TEMP/in-build-image"

    - name: Remote cache unit tests
      run: |
        "$RUNNER_TEMP/in-build-image" '$CORE_PYTHON -m unittest discover -s Common/3dParty && $CORE_PYTHON -m unittest discover -s scripts'

    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.cache/vcpkg
        key: vcpkg-${{ runner.os }}-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.docker/core.bake.Dockerfile') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.distro }}-${{ matrix.arch }}-

    - name: Restore ccache
      id: ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.cache/ccache
        key: ccache-${{ runner.os }}-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.distro }}-${{ matrix.arch }}-

    # The same script builds core in .docker/core.bake.Dockerfile, so the
    # package can replace that build. Also builds the third-party libs (ICU,
    # V8, etc.) missing from the remote cache, without uploading them.
    - name: Build core (x2t, docbuilder, etc.)
      run: |
        "$RUNNER_TEMP/in-build-image" 'ccache --zero-stats && scripts/build.sh --tests --ccache -- -DEO_NO_WARNINGS=ON'

    - name: ccache statistics
      if: always()
      run: |
        "$RUNNER_TEMP/in-build-image" 'ccache --show-stats' || true

    - name: Unit tests (CTest)
      run: |
        "$RUNNER_TEMP/in-build-image" 'ctest --test-dir build --output-on-failure'

    # x2ttester writes its font cache next to itself, so it runs from the build
    # tree: the package and the E2E overlay must not contain that cache. The
    # core libraries it loads are in bin/.
    - name: Conversion Test
      run: |
        "$RUNNER_TEMP/in-build-image" 'LD_LIBRARY_PATH=/core/build/package/bin ./Test/Applications/x2tTester/conversionTest.sh ./Test/Applications/x2tTester ../../../build/x2ttester'

    # build/package is what DocumentServer copies from core's Dockerfile.
    # Published by the publish job for pushes to main and same-repo PRs that
    # are up to date with their base.
    - name: Pack core
      if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      run: |
        toolchain="$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")"
        for product in ${{ matrix.packages }}; do
          "$RUNNER_TEMP/in-build-image" "\$CORE_PYTHON scripts/core_package.py pack \
            --from build/package --out build/core-package \
            --platform ${{ matrix.platform }} --product $product \
            --toolchain 'core-base $toolchain'"
        done

    # The container runs as root; hand the workspace back to the runner user
    # so cache saving and the next checkout on this self-hosted runner work.
    - name: Fix workspace ownership
      if: always()
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/core" "$BUILD_IMAGE" \
          chown -R "$(id -u):$(id -g)" /core

    # Save caches even when earlier steps fail, so each run reuses prior work.
    - name: Save vcpkg binary cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.cache/vcpkg
        key: vcpkg-${{ runner.os }}-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.docker/core.bake.Dockerfile') }}

    # Even when the build fails or is cancelled, so the next run reuses it.
    # A PR that started from main's cache doesn't save its own: the repo's
    # 10 GB of caches would evict main's, which every new PR starts from.
    - name: Save ccache
      if: always() && !(github.event_name == 'pull_request' && steps.ccache.outputs.cache-matched-key != '' && !contains(steps.ccache.outputs.cache-matched-key, '-pr-'))
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.cache/ccache
        key: ccache-${{ runner.os }}-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ github.run_id }}


    # ─────────────────────────────────────────────────────────────
    # E2E: overlay the freshly built core binaries onto the published
    # nightly image and run the DocumentServer Playwright suite. Reuses
    # the binaries already produced in build/package above, so it adds
    # no extra compile cost. The image, port and container name are per run:
    # runs overlap on the shared self-hosted host, and so does the
    # DocumentServer e2e job.
    # ─────────────────────────────────────────────────────────────
    - name: Check out DocumentServer e2e (current branch)
      if: matrix.product == 'server' && matrix.arch == 'amd64'
      id: docserver
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        repository: Euro-Office/DocumentServer
        path: documentserver
        ref: ${{ github.head_ref || github.ref_name }}
    - name: Check out DocumentServer e2e (main)
      if: matrix.product == 'server' && matrix.arch == 'amd64' && steps.docserver.outcome != 'success'
      uses: actions/checkout@v4
      with:
        repository: Euro-Office/DocumentServer
        path: documentserver
        ref: main

    - name: Use Node.js 20 for e2e
      if: matrix.product == 'server' && matrix.arch == 'amd64'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Pull nightly image
      if: matrix.product == 'server' && matrix.arch == 'amd64'
      run: docker pull ghcr.io/euro-office/documentserver:nightly

    - name: Build overlay image with fresh core binaries
      if: matrix.product == 'server' && matrix.arch == 'amd64'
      run: |
        set -euo pipefail
        cat > overlay.Dockerfile <<'EOF'
        ARG NIGHTLY_IMAGE
        FROM ${NIGHTLY_IMAGE}
        COPY . /tmp/core/
        # The CI build emits a flat build/package (binaries, tools and .so libs
        # together), unlike the bake which splits bin/tools. Rather than assume a
        # layout, overlay by filename: replace each same-named file already present
        # in the image's server tree (FileConverter/bin, FileConverter/lib,
        # server/tools). Fail if nothing matched, so a layout drift can't silently
        # pass. The install path is brand-derived; locate it via the sdkjs dir.
        RUN set -eu; \
            root="$(dirname "$(find /var/www -maxdepth 5 -type d -name sdkjs -path '*documentserver*' | head -n1)")"; \
            test -n "$root"; \
            count=0; \
            for f in $(find /tmp/core -type f); do \
              name="$(basename "$f")"; \
              for t in $(find "$root/server" -type f -name "$name"); do \
                cp -af "$f" "$t"; count=$((count+1)); echo "overlaid $name -> $t"; \
              done; \
            done; \
            echo "total files replaced: $count"; \
            [ "$count" -gt 0 ]; \
            rm -rf /tmp/core
        EOF
        docker build \
          --build-arg NIGHTLY_IMAGE=ghcr.io/euro-office/documentserver:nightly \
          -t euro-office/documentserver:e2e-core-${{ github.run_id }} \
          -f overlay.Dockerfile \
          build/package

    - name: Install e2e dependencies
      if: matrix.product == 'server' && matrix.arch == 'amd64'
      working-directory: documentserver/e2e
      run: npm ci

    - name: Install Playwright browsers
      if: matrix.product == 'server' && matrix.arch == 'amd64'
      working-directory: documentserver/e2e
      run: npx playwright install chromium --with-deps

    - name: Run E2E tests
      if: matrix.product == 'server' && matrix.arch == 'amd64'
      working-directory: documentserver/e2e
      env:
        E2E_IMAGE: euro-office/documentserver:e2e-core-${{ github.run_id }}
        E2E_CONTAINER_NAME: euro-office-e2e-core-${{ github.run_id }}
      run: E2E_HOST_PORT=$((20000 + GITHUB_RUN_ID % 10000)) npm test

    # The container's name is per run, so a later run can't clean up after a
    # cancelled one whose Playwright teardown never ran.
    - name: Remove E2E container and overlay image
      if: always() && matrix.product == 'server' && matrix.arch == 'amd64'
      run: |
        docker rm -f euro-office-e2e-core-${{ github.run_id }} || true
        docker image rm -f euro-office/documentserver:e2e-core-${{ github.run_id }} || true

    - name: Upload Playwright report
      if: always() && matrix.product == 'server' && matrix.arch == 'amd64'
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.sha }}
        path: documentserver/e2e/playwright-report/
        retention-days: 14

    # Last, so a leg that fails any test, E2E included, publishes nothing
    - name: Upload core package
      if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-artifact@v4
      with:
        name: core-package-${{ matrix.platform }}-${{ matrix.product }}
        path: build/core-package/
        retention-days: 1
        compression-level: 0

  # A manual run: builds the third-party libraries and uploads the ones
  # missing from the remote cache, through the build-assets environment. Qt
  # and CEF, which only the desktop app uses, in the desktop image (Qt needs
  # its -devel packages); the others in the server image, so they never link
  # a library that only the desktop image has.
  third-party:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: self-hosted }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: third-party (rocky8, ${{ matrix.arch }})
    environment: build-assets
    env:
      REMOTE_CACHE_S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      REMOTE_CACHE_S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      SERVER_IMAGE: euro-office/core-base-server-${{ matrix.arch }}:ci
      DESKTOP_IMAGE: euro-office/core-base-desktop-${{ matrix.arch }}:ci

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get core-base images
      run: |
        .github/scripts/core-base-image.sh server ${{ matrix.arch }} "$SERVER_IMAGE"
        .github/scripts/core-base-image.sh desktop ${{ matrix.arch }} "$DESKTOP_IMAGE"

    # Runs a command inside an image with the checkout mounted at /core
    - name: Create container wrapper
      run: |
        cat > "$RUNNER_TEMP/in-image" <<'SH'
        #!/bin/sh
        image="$1"; shift
        exec docker run --rm \
          -v "$GITHUB_WORKSPACE:/core" -w /core \
          -e REMOTE_CACHE_S3_ACCESS_KEY -e REMOTE_CACHE_S3_SECRET_KEY \
          -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
          "$image" bash -euo pipefail -c "$1"
        SH
        chmod +x "$RUNNER_TEMP/in-image"

    - name: Build the third-party libraries
      run: |
        "$RUNNER_TEMP/in-image" "$SERVER_IMAGE" 'scripts/build.sh --third-party-only --build-dir build/third-party'

    - name: Build Qt and CEF
      run: |
        "$RUNNER_TEMP/in-image" "$DESKTOP_IMAGE" '$CORE_PYTHON Common/3dParty/build_3rdparty.py --only=qt,cef build/third-party/qt-work build/third-party/qt-install'

    # The container runs as root; clean up as root, so the next checkout on
    # this self-hosted runner works
    - name: Remove the build tree
      if: always()
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/core" "$SERVER_IMAGE" rm -rf /core/build

  # Publishes the packages of the legs that passed
  publish:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/core-package-publish.yml
    secrets: inherit

  prune-ccache:
    needs: build
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      actions: write
    uses: ./.github/workflows/ccache-prune.yml
