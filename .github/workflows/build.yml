name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same split as the release images (.docker/core.bake.Dockerfile):
          # server → Rocky Linux 9, desktop → Ubuntu (22.04 on amd64).
          - product: server
            distro: rocky9
          - product: desktop
            distro: ubuntu
    name: build (${{ matrix.product }}, ${{ matrix.distro }})
    env:
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_PASS: ${{ secrets.NEXTCLOUD_PASS }}
      CCACHE_MAXSIZE: 2G
      BUILD_IMAGE: euro-office/core-base-${{ matrix.product }}:ci

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Build environment: the core-base stage of the release Dockerfile. The
    # stage has no COPY, so the Dockerfile is fed via stdin with an empty
    # build context. Layers are cached by the runner's Docker daemon.
    - name: Build core-base image from Dockerfile
      run: |
        docker build \
          --target core-base \
          --build-arg PRODUCT=${{ matrix.product }} \
          -t "$BUILD_IMAGE" \
          - < .docker/core.bake.Dockerfile

    # Runs a command inside the build image with the checkout mounted at
    # /core (same path as in the Dockerfile). The vcpkg binary cache is
    # mounted where the image's VCPKG_BINARY_SOURCES expects it.
    - name: Create container wrapper
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg" "$GITHUB_WORKSPACE/.cache/ccache"
        cat > "$RUNNER_TEMP/in-build-image" <<'SH'
        #!/bin/sh
        exec docker run --rm \
          -v "$GITHUB_WORKSPACE:/core" -w /core \
          -v "$GITHUB_WORKSPACE/.cache/vcpkg:/nuget-cache" \
          -e CCACHE_DIR=/core/.cache/ccache \
          -e CCACHE_MAXSIZE \
          -e NEXTCLOUD_USER -e NEXTCLOUD_PASS \
          "$BUILD_IMAGE" bash -euo pipefail -c "$1"
        SH
        chmod +x "$RUNNER_TEMP/in-build-image"

    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.cache/vcpkg
        key: vcpkg-${{ runner.os }}-${{ matrix.distro }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.docker/core.bake.Dockerfile') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.distro }}-

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.cache/ccache
        key: ccache-${{ runner.os }}-${{ matrix.distro }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.distro }}-

    - name: Configure core, build third_party libs (ICU, V8, etc.)
      run: |
        "$RUNNER_TEMP/in-build-image" '
          cmake -GNinja -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_MODE=ON -DVCPKG_MANIFEST_DIR=. \
            -DVCPKG_MANIFEST_FEATURES=tests -DEO_BUILD_TESTS=ON \
            -DPYTHON_BIN=$CORE_PYTHON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        '

    - name: Build core (x2t, docbuilder, etc.)
      run: |
        "$RUNNER_TEMP/in-build-image" 'cmake --build build'

    - name: ccache statistics
      if: always()
      run: |
        "$RUNNER_TEMP/in-build-image" 'ccache --show-stats' || true

    - name: Unit tests (CTest)
      run: |
        "$RUNNER_TEMP/in-build-image" 'ctest --test-dir build --output-on-failure'

    - name: Conversion Test
      run: |
        "$RUNNER_TEMP/in-build-image" './Test/Applications/x2tTester/conversionTest.sh ./Test/Applications/x2tTester ../../../build/package'

    # The container runs as root; hand the workspace back to the runner user
    # so cache saving and the next checkout on this self-hosted runner work.
    - name: Fix workspace ownership
      if: always()
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/core" "$BUILD_IMAGE" \
          chown -R "$(id -u):$(id -g)" /core

    # Save caches even when earlier steps fail, so each run reuses prior work.
    - name: Save vcpkg binary cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.cache/vcpkg
        key: vcpkg-${{ runner.os }}-${{ matrix.distro }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.docker/core.bake.Dockerfile') }}

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.cache/ccache
        key: ccache-${{ runner.os }}-${{ matrix.distro }}-${{ github.run_id }}


    # ─────────────────────────────────────────────────────────────
    # E2E: overlay the freshly built core binaries onto the published
    # nightly image and run the DocumentServer Playwright suite. Reuses
    # the binaries already produced in build/package above, so it adds
    # no extra compile cost. Unique port + container name avoid colliding
    # with the DocumentServer e2e job on the shared self-hosted host.
    # ─────────────────────────────────────────────────────────────
    - name: Check out DocumentServer e2e (current branch)
      if: matrix.product == 'server'
      id: docserver
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        repository: Euro-Office/DocumentServer
        path: documentserver
        ref: ${{ github.head_ref || github.ref_name }}
    - name: Check out DocumentServer e2e (main)
      if: matrix.product == 'server' && steps.docserver.outcome != 'success'
      uses: actions/checkout@v4
      with:
        repository: Euro-Office/DocumentServer
        path: documentserver
        ref: main

    - name: Use Node.js 20 for e2e
      if: matrix.product == 'server'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Pull nightly image
      if: matrix.product == 'server'
      run: docker pull ghcr.io/euro-office/documentserver:nightly

    - name: Build overlay image with fresh core binaries
      if: matrix.product == 'server'
      run: |
        set -euo pipefail
        cat > overlay.Dockerfile <<'EOF'
        ARG NIGHTLY_IMAGE
        FROM ${NIGHTLY_IMAGE}
        COPY . /tmp/core/
        # The CI build emits a flat build/package (binaries, tools and .so libs
        # together), unlike the bake which splits bin/tools. Rather than assume a
        # layout, overlay by filename: replace each same-named file already present
        # in the image's server tree (FileConverter/bin, FileConverter/lib,
        # server/tools). Fail if nothing matched, so a layout drift can't silently
        # pass. The install path is brand-derived; locate it via the sdkjs dir.
        RUN set -eu; \
            root="$(dirname "$(find /var/www -maxdepth 5 -type d -name sdkjs -path '*documentserver*' | head -n1)")"; \
            test -n "$root"; \
            count=0; \
            for f in $(find /tmp/core -type f); do \
              name="$(basename "$f")"; \
              for t in $(find "$root/server" -type f -name "$name"); do \
                cp -af "$f" "$t"; count=$((count+1)); echo "overlaid $name -> $t"; \
              done; \
            done; \
            echo "total files replaced: $count"; \
            [ "$count" -gt 0 ]; \
            rm -rf /tmp/core
        EOF
        docker build \
          --build-arg NIGHTLY_IMAGE=ghcr.io/euro-office/documentserver:nightly \
          -t euro-office/documentserver:e2e-core \
          -f overlay.Dockerfile \
          build/package

    - name: Install e2e dependencies
      if: matrix.product == 'server'
      working-directory: documentserver/e2e
      run: npm ci

    - name: Install Playwright browsers
      if: matrix.product == 'server'
      working-directory: documentserver/e2e
      run: npx playwright install chromium --with-deps

    - name: Run E2E tests
      if: matrix.product == 'server'
      working-directory: documentserver/e2e
      env:
        E2E_IMAGE: euro-office/documentserver:e2e-core
        E2E_HOST_PORT: 8989
        E2E_CONTAINER_NAME: euro-office-e2e-core
      run: npm test

    - name: Upload Playwright report
      if: always() && matrix.product == 'server'
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.sha }}
        path: documentserver/e2e/playwright-report/
        retention-days: 14