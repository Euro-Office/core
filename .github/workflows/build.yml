name: Build

on:
  push:

jobs:
  build:
    runs-on: [ubuntu-latest, self-hosted]
    env:
      PLEASE_PRELOAD_LIBSTDCPP: true

    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
                git \
                curl \
                wget \
                ssh \
                build-essential \
                make \
                cmake \
                ninja-build \
                pkg-config \
                libglib2.0-dev \
                python3 \
                python-is-python3 \
                lsb-release \
                libboost-all-dev \
                ccache

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
        max-size: 2G

    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cache/
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Configure with CMake
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        export CC="ccache gcc"
        export CXX="ccache g++"
        cmake -GNinja -S . -B build -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        cmake --build build

    - name: ccache statistics
      run: ccache -s
