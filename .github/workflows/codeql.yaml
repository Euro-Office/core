name: "CodeQL Scanner"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '00 19 * * 5'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    # The CI build runs inside a Docker image where the CodeQL tracer cannot
    # observe the compiler, so analyze the sources without building them.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: none
        queries: security-extended
        config: |
          paths-ignore:
            - Common/3dParty
            - UnicodeConverter/icubuilds-mac
            - DesktopEditor/agg-2.4
            - DesktopEditor/cximage
            - DesktopEditor/freetype-2.10.4
            - DesktopEditor/freetype-2.5.2
            - DesktopEditor/freetype_names
            - DesktopEditor/xml/libxml2
            - DesktopEditor/raster/Jp2/openjpeg
            - DesktopEditor/raster/JBig2/source
            - PdfFile/lib
            - DjVuFile/libdjvu


    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"
