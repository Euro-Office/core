# Every run saves its ccache under a new key, and only the newest one per build
# leg is ever restored. Deletes the others of this ref, or the repository's
# Actions caches outgrow their limit and GitHub evicts the ones still in use.
name: Prune ccache

on:
  workflow_call:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Prune
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Workflows prune at the same time: a cache may be gone already
        # Windows' vcpkg binary cache uses the same <prefix>-<run_id> keys
        for prefix in ccache- vcpkg-windows-; do
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" \
              --sort created_at --order desc --limit 1000 --json id,key
        done |
          jq -rs 'add // [] | group_by(.key | sub("-[0-9]+$"; "")) | map(.[1:]) | flatten | .[].id' |
          while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
