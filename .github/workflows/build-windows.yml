name: Build (Windows)

on:
  pull_request:
  push:
    branches: [main, 'stable-*']
  workflow_dispatch:

# A new push to a pull request cancels its previous run, which also keeps an
# older run from publishing its core package after a newer one. Other runs
# (manual ones included) get a group of their own: GitHub keeps only one
# pending run per group, so queued commits on main would lose their package.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # arm64 builds natively on an arm64 runner (it used to be cross-compiled)
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arm64 image has only Visual Studio 2026, with the v143
          # toolset of Visual Studio 2022 (14.44) and no Windows 10 SDK
          - { arch: x64,   runner: windows-2022,   sdk: 10.0.19041.0, vc_tools: '' }
          - { arch: arm64, runner: windows-11-arm, sdk: 10.0.22621.0, vc_tools: '14.44' }
    name: build (windows, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.event_name == 'workflow_dispatch' && 'build-assets' || '' }}

    env:
      PYTHONUTF8: "1"
      # Only set on a manual run, through the build-assets environment: that
      # run uploads missing third-party builds, every other run only reads.
      REMOTE_CACHE_S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      REMOTE_CACHE_S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------ #
      # 2. Install Cygwin WITHOUT touching PATH.
      #
      #    By default cygwin-install-action PREPENDS C:\cygwin\bin to PATH,
      #    which makes Cygwin's perl/python/git/cmake shadow the Windows-
      #    native tools no matter what we do afterwards. add-to-path: false
      #    stops that at the source — no shim renaming needed.
      # ------------------------------------------------------------------ #
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          # Pin the install location explicitly. The action's default has
          # changed between versions (C:\cygwin, later D:\cygwin), while
          # most build scripts that shell out to Cygwin assume the stock
          # installer location C:\cygwin64. A hardcoded path that doesn't
          # exist is exactly what produces Windows error 3:
          # "The system cannot find the path specified."
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: >-
            automake
            cmake
            make
            git
            python3
            python3-devel

      # ------------------------------------------------------------------ #
      # 3. Build a deterministic PATH:
      #      [native perl/python/git/cmake dirs] ; [Cygwin] ; [everything else]
      #
      #    Why not just append Cygwin at the end? Because the runner image
      #    already has Git's MSYS tools (C:\Program Files\Git\usr\bin) in
      #    PATH — with Cygwin last, a bare `bash`/`sh` resolves to Git's
      #    MSYS bash, which is NOT a valid substitute for a Cygwin/MSVC
      #    build of ICU. This ordering gives Cygwin's bash/make/sh priority
      #    while the four conflicting tools stay Windows-native.
      #
      #    CYGWIN_ROOT is exported for build scripts that locate Cygwin
      #    via an environment variable instead of PATH.
      # ------------------------------------------------------------------ #
      - name: Set up PATH ordering (native tools > Cygwin > rest)
        shell: pwsh
        run: |
          $cyg = 'C:\cygwin64'
          $nativeDirs = @()
          foreach ($tool in 'perl', 'python', 'git', 'cmake') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd -and ($cmd.Source -notlike "$cyg\*")) {
              $dir = Split-Path $cmd.Source
              # Git for Windows trap: 'Git\bin' contains git.exe but ALSO
              # bash.exe and sh.exe, which would shadow Cygwin's. The
              # sibling 'Git\cmd' directory contains only the git launcher,
              # so prefer that one.
              if ($tool -eq 'git' -and $dir -like '*\Git\bin') {
                $cmdDir = Join-Path (Split-Path $dir) 'cmd'
                if (Test-Path (Join-Path $cmdDir 'git.exe')) { $dir = $cmdDir }
              }
              if ($nativeDirs -notcontains $dir) { $nativeDirs += $dir }
              Write-Host ("native {0,-8} -> {1}  (PATH dir: {2})" -f $tool, $cmd.Source, $dir)
            }
          }
          $newPath = ($nativeDirs + "$cyg\bin" + $env:PATH) -join ';'
          "PATH=$newPath"      | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYGWIN_ROOT=$cyg"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ------------------------------------------------------------------ #
      # 4. The v143 toolset (Visual Studio 2022) on both arches: V8's build
      #    supports VS up to 2022 only, and the uploaded third-party builds
      #    must stay linkable by consumers built with VS 2022
      #    (DesktopEditors). On arm64 it comes with Visual Studio 2026.
      # ------------------------------------------------------------------ #
      - name: Locate Visual Studio
        shell: pwsh
        run: |
          . scripts/msvc-env.ps1
          $installPath = Find-VisualStudio -VcToolsVersion '${{ matrix.vc_tools }}'
          Write-Host "Visual Studio: $installPath"
          "VSPATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ------------------------------------------------------------------ #
      # 5. Install Windows SDK 10.0.19041.0
      # ------------------------------------------------------------------ #
      - name: Install Windows SDK 10.0.19041.0
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = $env:VSPATH
          Write-Host "VS install path: $installPath"
          & $vsInstaller modify `
            --installPath $installPath `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --quiet --norestart --force
          if ($LASTEXITCODE -notin @(0, 3010)) {
            Write-Warning "vs_installer returned $LASTEXITCODE — SDK may already be installed, continuing."
          }

      # ------------------------------------------------------------------ #
      # 6. Verify tool resolution — Get-Command shows exactly which binary
      #    each bare name resolves to, so failures are self-explanatory.
      # ------------------------------------------------------------------ #
      - name: Verify tool versions
        shell: pwsh
        run: |
          foreach ($tool in 'perl', 'python', 'git', 'cmake') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host ("{0,-8} -> {1}" -f $tool, $cmd.Source)
              if ($cmd.Source -like 'C:\cygwin64\*') {
                throw "ERROR: '$tool' resolves to the Cygwin copy at $($cmd.Source)."
              }
            } else {
              Write-Host ("{0,-8} -> (not found in PATH)" -f $tool)
            }
          }

          # These SHOULD be the Cygwin copies (ICU's Cygwin/MSVC build needs them)
          foreach ($tool in 'bash', 'sh', 'make') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host ("{0,-8} -> {1}" -f $tool, $cmd.Source)
              if ($cmd.Source -notlike 'C:\cygwin64\*') {
                throw "ERROR: '$tool' resolves to a non-Cygwin copy at $($cmd.Source)."
              }
            } else {
              throw "ERROR: '$tool' not found in PATH."
            }
          }

          Write-Host "--- perl ---"
          perl --version | Select-String 'This is perl'
          $perlOut = (perl --version) -join ''
          if ($perlOut -match 'cygwin') {
            throw "ERROR: 'perl' is Cygwin Perl."
          }

          Write-Host "--- python ---"
          python --version
          py --version

          Write-Host "--- git ---"
          git --version

          Write-Host "--- cmake ---"
          cmake --version

          # NB: don't try to run C:\cygwin64\bin\python3 directly from pwsh —
          # it's a Cygwin-style symlink that cmd/pwsh can't execute. If you
          # ever need Cygwin python, call it via:
          #   C:\cygwin64\bin\bash.exe -lc 'python3 --version'

      # ------------------------------------------------------------------ #
      # 7. Set up vcpkg  (matches the Linux workflow)
      # ------------------------------------------------------------------ #
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      # vcpkg's own GitHub cache backend (x-gha) is gone: keep its binary
      # cache in a directory. A new runner image (compiler) starts a new key.
      # Each save gets a new key, as with ccache: a key can't be overwritten,
      # so an exact one would keep an empty or stale cache for good.
      - name: vcpkg cache key
        id: vcpkg-key
        shell: pwsh
        run: |
          $hash = '${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}'
          "prefix=vcpkg-windows-${{ matrix.arch }}-$env:ImageVersion-$hash-" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg
          key: ${{ steps.vcpkg-key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.vcpkg-key.outputs.prefix }}

      # What was restored, so the save only happens when vcpkg built something
      - name: Hash restored vcpkg binary cache
        id: vcpkg-restored
        shell: pwsh
        run: |
          "hash=${{ hashFiles('.cache/vcpkg/**') }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ------------------------------------------------------------------ #
      # 8. ccache: build.ps1 installs it and sets up the rest
      # ------------------------------------------------------------------ #
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ github.run_id }}
          restore-keys: ccache-windows-${{ matrix.arch }}-

      # ------------------------------------------------------------------ #
      # 9. Build: the MSVC environment of the toolset of step 4, Ninja,
      #    as in DesktopEditors
      # ------------------------------------------------------------------ #
      - name: Build
        shell: pwsh
        run: |
          # Here, not in env: run-vcpkg sets it for the later steps
          $vcpkgCache = '${{ github.workspace }}/.cache/vcpkg'
          New-Item -ItemType Directory -Force -Path $vcpkgCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$vcpkgCache,readwrite"
          scripts/build.ps1 -Arch ${{ matrix.arch }} -SdkVersion ${{ matrix.sdk }} -VcToolsVersion '${{ matrix.vc_tools }}' -Ccache '-DEO_NO_WARNINGS=ON'

      - name: ccache statistics
        if: always()
        shell: pwsh
        run: ccache --show-stats --verbose

      # Only when vcpkg added packages: not empty, not what was restored
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-key.outputs.prefix != '' && hashFiles('.cache/vcpkg/**') != '' && hashFiles('.cache/vcpkg/**') != steps.vcpkg-restored.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/vcpkg
          key: ${{ steps.vcpkg-key.outputs.prefix }}${{ github.run_id }}

      # Even when the build fails or is cancelled, so the next run reuses it.
      # A PR that started from main's cache doesn't save its own: the repo's
      # 10 GB of caches would evict main's, which every new PR starts from.
      - name: Save ccache
        if: always() && !(github.event_name == 'pull_request' && steps.ccache.outputs.cache-matched-key != '' && !contains(steps.ccache.outputs.cache-matched-key, '-pr-'))
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ github.run_id }}

      # ------------------------------------------------------------------ #
      # 10. Upload build artifacts
      # ------------------------------------------------------------------ #
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows-${{ matrix.arch }}
          path: |
            build/package/bin/
            build/package/tools/
          if-no-files-found: warn

      - name: Pack core
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: |
          python scripts/core_package.py pack `
            --from build/package --out core-package `
            --platform windows-${{ matrix.arch }} --product desktop `
            --toolchain "VS $env:VSPATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload core package
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: core-package-windows-${{ matrix.arch }}-desktop
          path: core-package/
          retention-days: 1
          compression-level: 0

  # Publishes the packages of the legs that passed
  publish:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/core-package-publish.yml
    secrets: inherit

  prune-ccache:
    needs: build
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      actions: write
    uses: ./.github/workflows/ccache-prune.yml

  build-summary:
    # Aggregate job: the branch rules for main require a check called "build",
    # and this keeps it on the Windows builds, both architectures.
    name: build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        run: |
          result="${{ needs.build.result }}"
          echo "Windows build result: $result"
          if [ "$result" = "success" ]; then
            exit 0
          fi
          echo "Windows build failed (result: $result)."
          exit 1
