# Known schema failures in the documents core writes, see scripts/validate_schema.py.
# Every entry needs the issue that tracks the writer bug. Remove an entry when it is fixed:
# the job reports entries that matched nothing.
# libxml2 reports one cascade of errors per ODF part, so an ODF part listed here is blind to further failures.
#
# file glob | part glob | message regex  # issue

# OOXML written out of schema order, Word reads it
* | word/document.xml | Element '(type|footnotePr|lastRenderedPageBreak|tcBorders|jc|rPr)': This element is not expected  # https://github.com/Euro-Office/core/issues/331
* | word/document.xml | Element 'spacing': This element is not expected  # https://github.com/Euro-Office/core/issues/331
* | word/styles.xml | Element '(spacing|rPr|widowControl|ind)': This element is not expected  # https://github.com/Euro-Office/core/issues/331
* | word/footnotes.xml | Element 'spacing': This element is not expected  # https://github.com/Euro-Office/core/issues/331
* | word/settings.xml | Element 'defaultTabStop': This element is not expected  # https://github.com/Euro-Office/core/issues/331
* | word/fontTable.xml | Element 'charset': This element is not expected  # https://github.com/Euro-Office/core/issues/331

# OOXML values and attributes the schema rejects
* | word/numbering.xml | Element 'tmpl', attribute 'val': '1' is not a valid value of the atomic type 'ST_LongHexNumber'  # https://github.com/Euro-Office/core/issues/331
* | docProps/app.xml | Element 'vector': Missing child element  # https://github.com/Euro-Office/core/issues/331
* | xl/styles.xml | Element 'numFmts', attribute 'formatCode': The attribute 'formatCode' is not allowed  # https://github.com/Euro-Office/core/issues/331
* | xl/worksheets/*.xml | Element 'selection', attribute 'activePane': The attribute 'activePane' is not allowed  # https://github.com/Euro-Office/core/issues/331
* | xl/sharedStrings.xml | Element 't', attribute 'space': The attribute 'space' is not allowed  # https://github.com/Euro-Office/core/issues/331

# ODF 1.2 parts libxml2 rejects (the RELAX NG messages name no attribute or element)
* | META-INF/manifest.xml | Element manifest failed to validate attributes  # https://github.com/Euro-Office/core/issues/331
* | settings.xml | Element document-settings failed to validate attributes|Expecting an element|Invalid sequence in interleave  # https://github.com/Euro-Office/core/issues/331
* | styles.xml | Element list-level-style-number has extra content: list-level-properties|Element list-style has extra content: list-level-style-number|Extra element list-style in interleave|Element styles failed to validate content|Invalid sequence in interleave  # https://github.com/Euro-Office/core/issues/331
* | content.xml | Expecting element map, got table-properties|Element style has extra content: table-properties|Extra element style in interleave|Element automatic-styles failed to validate content|Invalid sequence in interleave  # https://github.com/Euro-Office/core/issues/331
